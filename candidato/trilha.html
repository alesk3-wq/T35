<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../assets/img/favi-t35.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilha - T35 Academy</title>
    <link rel="stylesheet" href="../assets/css/design-system.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <style>
        .content { padding: 1.5rem; max-width: 900px; }

        .trilha-back {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-secondary);
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 1rem;
            transition: color 0.2s;
        }
        .trilha-back:hover { color: var(--amber); }

        .trilha-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin: 0 0 0.25rem 0;
        }
        .trilha-instrutor {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0 0 1.25rem 0;
        }

        .trilha-total {
            background: var(--bg2);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .trilha-total-pct {
            font-size: 32px;
            font-weight: 700;
            color: var(--amber);
            line-height: 1;
        }
        .trilha-total-track { flex: 1; min-width: 180px; }
        .trilha-total-bar {
            height: 8px;
            background: var(--border);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 0.4rem;
        }
        .trilha-total-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        .badge-trilha-concluida {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.9rem;
            background: rgba(34,197,94,0.12);
            border: 1px solid rgba(34,197,94,0.3);
            color: #22c55e;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .modulo-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.1rem 1.25rem;
            margin-bottom: 0.9rem;
        }
        .modulo-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.6rem;
        }
        .modulo-card-titulo { font-size: 15px; font-weight: 700; color: var(--text); }
        .modulo-card-pct { font-size: 13px; font-weight: 700; color: var(--amber); }

        .modulo-card-bar {
            height: 6px;
            background: var(--border);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 0.85rem;
        }
        .modulo-card-fill {
            height: 100%;
            background: var(--amber);
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        .modulo-card-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }

        .btn-modulo-item {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.55rem 0.9rem;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }

        .empty-trilha {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }
        .empty-trilha svg { width: 56px; height: 56px; opacity: 0.3; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="../assets/img/t35logo.png" alt="T35 Academy" class="logo">
            <h2>T35 Academy</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="catalogo.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                <span>Catálogo</span>
            </a>
            <a href="meus-cursos.html" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <span>Meus Cursos</span>
            </a>
            <a href="certificados.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6-3 6 3v6l-6 3-6-3V9z"/><path d="M12 12v6"/></svg>
                <span>Certificados</span>
            </a>
            <a href="condecorados.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
                <span>Condecorados</span>
            </a>
            <a href="sobre.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>Sobre</span>
            </a>
            <a href="manual.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <span>Ajuda</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn-logout" id="btnLogout">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <div class="topbar">
        <button class="btn-menu" id="btnMenu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="page-title">Trilha</h1>
    </div>

    <main class="main">
        <div class="content" id="pageContent">
            <div style="color:var(--text-secondary);padding:3rem;text-align:center">Carregando...</div>
        </div>
    </main>

    <script type="module">
        import { handleLogout, checkAuth } from '../assets/js/auth.js';
        import { toggleSidebar } from '../assets/js/ui-shell.js';
        import { db } from '../firebase-config.js';
        import {
            doc, getDoc
        } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';
        import { calcularProgressoTrilha } from '../assets/js/trilha-progress.js';

        document.getElementById('btnMenu').addEventListener('click', toggleSidebar);
        document.getElementById('btnLogout').addEventListener('click', handleLogout);

        const params      = new URLSearchParams(location.search);
        const inscricaoId = params.get('inscricaoId');
        const cursoId     = params.get('cursoId');

        function corPorPct(pct, concluido) {
            if (concluido) return '#22c55e';
            if (pct >= 50) return '#f59e0b';
            return '#ef4444';
        }

        function renderPagina(curso, inscricaoData) {
            const content = document.getElementById('pageContent');

            if (!curso.modulos?.length) {
                content.innerHTML = `
                    <a href="meus-cursos.html" class="trilha-back">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                        Voltar para Meus Cursos
                    </a>
                    <div class="empty-trilha">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        </svg>
                        <p>Este curso ainda não tem módulos cadastrados.</p>
                    </div>`;
                return;
            }

            const { modulos, totalPct, todosConcluidos } = calcularProgressoTrilha(curso, inscricaoData);

            content.innerHTML = `
                <a href="meus-cursos.html" class="trilha-back">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                    Voltar para Meus Cursos
                </a>

                <h1 class="trilha-title">${curso.titulo}</h1>
                <p class="trilha-instrutor">👨‍🏫 ${curso.instrutor}</p>

                <div class="trilha-total">
                    <div class="trilha-total-pct">${totalPct}%</div>
                    <div class="trilha-total-track">
                        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);">
                            <span>Progresso total da trilha</span>
                            <span>${modulos.length} módulo${modulos.length > 1 ? 's' : ''}</span>
                        </div>
                        <div class="trilha-total-bar">
                            <div class="trilha-total-fill" style="width:${totalPct}%;background:${corPorPct(totalPct, todosConcluidos)}"></div>
                        </div>
                    </div>
                    ${todosConcluidos ? `
                        <span class="badge-trilha-concluida">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                            Trilha concluída
                        </span>` : ''}
                </div>

                ${modulos.map((m, idx) => `
                    <div class="modulo-card">
                        <div class="modulo-card-header">
                            <span class="modulo-card-titulo">${idx + 1}. ${m.titulo}</span>
                            <span class="modulo-card-pct" style="color:${corPorPct(m.pctModulo, m.concluido)}">${m.temConteudo ? m.pctModulo + '%' : 'Sem conteúdo'}</span>
                        </div>
                        <div class="modulo-card-bar">
                            <div class="modulo-card-fill" style="width:${m.pctModulo}%;background:${corPorPct(m.pctModulo, m.concluido)}"></div>
                        </div>
                        <div class="modulo-card-actions">
                            ${m.temVideo ? `
                                <a class="btn-modulo-item" style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.25);color:var(--amber);"
                                   href="video.html?inscricaoId=${inscricaoId}&cursoId=${cursoId}&moduloId=${m.id}">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                    Vídeo${m.pctVideo !== null ? ` (${m.pctVideo}%)` : ''}
                                </a>` : ''}
                            ${m.temDocumento ? `
                                <a class="btn-modulo-item" style="background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.25);color:#3b82f6;"
                                   href="documento.html?inscricaoId=${inscricaoId}&cursoId=${cursoId}&moduloId=${m.id}">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                                    Documento${m.pctDocumento !== null ? ` (${m.pctDocumento}%)` : ''}
                                </a>` : ''}
                        </div>
                    </div>
                `).join('')}
            `;
        }

        checkAuth().then(async user => {
            if (!user) { window.location.href = '../login.html'; return; }
            if (!inscricaoId || !cursoId) { window.location.href = 'meus-cursos.html'; return; }

            try {
                const [inscricaoSnap, cursoSnap] = await Promise.all([
                    getDoc(doc(db, 'inscricoes', inscricaoId)),
                    getDoc(doc(db, 'cursos', cursoId))
                ]);

                if (!inscricaoSnap.exists() || inscricaoSnap.data().candidatoId !== user.uid) {
                    window.location.href = 'meus-cursos.html';
                    return;
                }
                if (!cursoSnap.exists()) {
                    window.location.href = 'meus-cursos.html';
                    return;
                }

                renderPagina(cursoSnap.data(), inscricaoSnap.data());
            } catch (err) {
                console.error(err);
                document.getElementById('pageContent').innerHTML =
                    '<p style="color:var(--text-secondary);padding:2rem">Erro ao carregar a trilha.</p>';
            }
        });
    </script>
</body>
</html>
